<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voctarium STT</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', path='voctarium-icon.ico') }}" />
    <link rel="icon" type="image/png" href="{{ url_for('static', path='voctarium-icon.png') }}" />
    <link rel="stylesheet" href="{{ url_for('static', path='shared.css') }}" />
    <link rel="stylesheet" href="{{ url_for('static', path='job-result.css') }}" />
  </head>
  <body class="result-page" data-theme="dark">
    <main
      id="result-root"
      class="result-layout"
      data-job-id="{{ job_id }}"
      data-job-exists="{{ 'true' if job_exists else 'false' }}"
    >
      <section class="panel result-shell">
        <header class="result-header">
          <div class="result-title-block">
            <div class="result-title-row">
              <a id="back-link" class="icon-action-btn as-link result-back-link" href="/" aria-label="Назад" title="Назад">
                <svg class="icon-action-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M4.5 11.2 12 5l7.5 6.2" />
                  <path d="M6.8 10.2v8.5h10.4v-8.5" />
                  <path d="M10.2 18.7v-5h3.6v5" />
                </svg>
              </a>
              <h1 id="result-title" class="result-title">Voctarium</h1>
            </div>
          </div>

          <div class="result-actions">
            <div id="download-menu-anchor" class="download-menu-anchor">
              <button
                id="download-menu-btn"
                class="download-menu-btn"
                type="button"
                aria-label="Скачать файл"
                aria-expanded="false"
                aria-haspopup="true"
                title="Скачать файл"
                disabled
              >
                <svg class="download-menu-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M6.2 4.8h10.7l1.9 1.9v12.5H5.2V4.8Z" />
                  <path d="M8.4 4.8v5.1h7.1V4.8" />
                  <path d="M8.8 14.8h6.4v4.4H8.8Z" />
                  <path d="M13.8 6.6h1.3" />
                </svg>
              </button>
              <section id="download-menu" class="download-menu-panel" hidden>
                <button id="download-link" class="download-menu-option" type="button" data-i18n="actions.download" disabled>
                  Скачать .md
                </button>
                <button id="download-pdf-btn" class="download-menu-option" type="button" data-i18n="actions.downloadPdf" disabled>
                  Скачать PDF
                </button>
              </section>
            </div>
            <button id="player-toggle-btn" class="icon-action-btn" type="button" aria-label="Скрыть плеер" title="Скрыть плеер" hidden disabled>
              <svg class="icon-action-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M5 12.7v-.8a7 7 0 0 1 14 0v.8" />
                <path d="M6.7 12.3h2.2v6.2H6.7A2.2 2.2 0 0 1 4.5 16.3v-1.8a2.2 2.2 0 0 1 2.2-2.2Z" />
                <path d="M17.3 12.3h-2.2v6.2h2.2a2.2 2.2 0 0 0 2.2-2.2v-1.8a2.2 2.2 0 0 0-2.2-2.2Z" />
              </svg>
            </button>
            <button id="remove-btn" class="icon-action-btn" type="button" aria-label="Удалить" title="Удалить">
              <svg class="icon-action-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M5.2 7.2h13.6" />
                <path d="M9.7 7.2v-2h4.6v2" />
                <path d="M7.4 7.7 8.3 19h7.4l.9-11.3" />
                <path d="M10.3 11.2v4.3" />
                <path d="M13.7 11.2v4.3" />
              </svg>
            </button>
            <button id="toolbar-toggle-btn" class="toolbar-toggle-btn" type="button" aria-label="Свернуть панель" title="Свернуть панель" aria-expanded="true" disabled>
              <svg class="toolbar-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="m6 9 6 6 6-6" />
              </svg>
            </button>
          </div>
        </header>

        <section id="editor-toolbar" class="result-info-panel editor-toolbar" hidden>
          <div class="editor-toolbar-main">
            <div class="mode-switch editor-toolbar-formatting">
              <button id="editor-bold-btn" class="chip" type="button" data-i18n="result.bold">Жирный</button>
              <button id="editor-italic-btn" class="chip" type="button" data-i18n="result.italic">Курсив</button>
              <button id="editor-paragraph-btn" class="chip" type="button" data-i18n="result.paragraph">Параграф</button>
              <button id="editor-h2-btn" class="chip" type="button" data-i18n="result.heading2">H2</button>
              <button id="editor-h3-btn" class="chip" type="button" data-i18n="result.heading3">H3</button>
              <button id="editor-bullets-btn" class="chip" type="button" data-i18n="result.bulletList">Маркированный список</button>
              <button id="editor-ordered-btn" class="chip" type="button" data-i18n="result.orderedList">Нумерованный список</button>
              <button id="editor-undo-btn" class="chip" type="button" data-i18n="result.undo">Undo</button>
              <button id="editor-redo-btn" class="chip" type="button" data-i18n="result.redo">Redo</button>
              <button id="editor-find-btn" class="chip" type="button" data-i18n="result.find">Поиск</button>
              <button id="editor-reset-btn" class="chip" type="button" data-i18n="result.reset">Сбросить</button>
            </div>
            <div class="editor-toolbar-utility">
              <div id="view-popover-anchor" class="toolbar-popover-anchor">
                <button id="view-toggle-btn" class="ghost-btn compact-btn" type="button" data-i18n="result.view">
                  Вид
                </button>
                <section id="reader-controls-panel" class="result-popover reader-controls-panel" hidden>
                  <div class="reader-controls-grid">
                    <label class="reader-control-field">
                      <span class="reader-control-label" data-i18n="result.fontSize">Размер шрифта</span>
                      <div class="reader-number-row">
                        <input id="reader-font-size-input" type="number" min="12" max="32" step="1" value="18" />
                        <span class="micro-badge">px</span>
                      </div>
                    </label>

                    <div class="reader-control-field">
                      <span class="reader-control-label" data-i18n="result.lineHeight">Межстрочие</span>
                      <div class="mode-switch">
                        <button id="reader-line-compact-btn" class="chip" type="button" data-i18n="result.lineCompact">
                          Плотно
                        </button>
                        <button id="reader-line-normal-btn" class="chip active" type="button" data-i18n="result.lineNormal">
                          Нормально
                        </button>
                        <button id="reader-line-relaxed-btn" class="chip" type="button" data-i18n="result.lineRelaxed">
                          Свободно
                        </button>
                      </div>
                    </div>

                    <div class="reader-control-field">
                      <span class="reader-control-label" data-i18n="result.contentWidth">Ширина текста</span>
                      <div class="reader-range-row">
                        <input id="reader-width-input" type="range" min="50" max="100" step="5" value="100" />
                        <span id="reader-width-value" class="micro-badge">100%</span>
                      </div>
                    </div>

                    <div class="reader-control-field">
                      <span class="reader-control-label" data-i18n="result.justify">Выравнивание</span>
                      <div class="mode-switch">
                        <button id="reader-justify-left-btn" class="chip" type="button" data-i18n="result.justifyLeft">
                          По левому краю
                        </button>
                        <button id="reader-justify-full-btn" class="chip active" type="button" data-i18n="result.justifyOn">
                          По ширине
                        </button>
                        <button id="reader-justify-hyphen-btn" class="chip" type="button" data-i18n="result.justifyHyphen">
                          По ширине + переносы
                        </button>
                      </div>
                    </div>

                    <div class="reader-control-field reader-toggle-field">
                      <label class="checkbox-card reader-toggle-card">
                        <input id="reader-paragraph-gap-input" type="checkbox" />
                        <strong data-i18n="result.paragraphGap">Пустая строка между абзацами</strong>
                      </label>
                    </div>
                  </div>
                </section>
              </div>
              <div id="info-popover-anchor" class="toolbar-popover-anchor">
                <button id="info-toggle-btn" class="ghost-btn compact-btn" type="button" data-i18n="result.metaTitle">
                  Инфо
                </button>
                <section id="result-info-panel" class="result-popover result-info-panel" hidden>
                  <div id="result-meta" class="result-meta-grid"></div>
                </section>
              </div>
            </div>
          </div>
          <div class="editor-toolbar-status">
            <button id="editor-save-btn" class="secondary-btn compact-btn" type="button" data-i18n="actions.save">
              Сохранить
            </button>
            <span id="editor-save-status" class="micro-badge" data-i18n="result.editorStatusIdle">Без изменений</span>
            <span id="editor-dirty-indicator" class="micro-badge" hidden>•</span>
            <span id="editor-word-count" class="reader-count"></span>
          </div>
        </section>

        <section class="result-main">
          <div id="result-banner" class="result-banner"></div>
          <div id="result-reader-stage" class="result-reader-stage">
            <div id="result-content" class="result-content-card empty"></div>
            <section id="editor-findbar" class="result-info-panel editor-findbar" hidden>
              <div class="editor-findbar-main">
                <input id="editor-find-input" type="search" placeholder="Найти в документе" data-i18n-placeholder="result.findPlaceholder" />
                <span id="editor-find-status" class="micro-badge" data-i18n="result.findNoResults">Ничего не найдено</span>
              </div>
              <div class="editor-findbar-actions">
                <button id="editor-find-prev-btn" class="ghost-btn compact-btn" type="button" data-i18n="result.findPrev">Назад</button>
                <button id="editor-find-next-btn" class="ghost-btn compact-btn" type="button" data-i18n="result.findNext">Вперед</button>
                <button id="editor-find-close-btn" class="ghost-btn compact-btn" type="button" data-i18n="result.findClose">Закрыть поиск</button>
              </div>
            </section>
          </div>
        </section>

        <section id="result-player" class="result-player" hidden>
          <audio id="result-audio" preload="auto"></audio>
          <div class="player-transport">
            <button id="player-rewind-btn" class="player-icon-btn" type="button" aria-label="Назад 5 секунд" title="Назад 5 секунд">
              <svg class="player-control-icon player-control-icon-fill" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M11 6v12l-7-6Z" />
                <path d="M20 6v12l-7-6Z" />
              </svg>
            </button>
            <button id="player-play-btn" class="player-play-btn" type="button" aria-label="Воспроизвести" title="Воспроизвести">
              <span id="player-play-icon" aria-hidden="true">
                <svg class="player-control-icon player-control-icon-fill" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M9 6v12l10-6Z" />
                </svg>
              </span>
            </button>
            <button id="player-forward-btn" class="player-icon-btn" type="button" aria-label="Вперед 5 секунд" title="Вперед 5 секунд">
              <svg class="player-control-icon player-control-icon-fill" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M13 6v12l7-6Z" />
                <path d="M4 6v12l7-6Z" />
              </svg>
            </button>
            <span id="player-current-time" class="player-time">00:00</span>
            <canvas id="player-waveform" class="player-waveform" height="48"></canvas>
            <span id="player-duration" class="player-time">00:00</span>
          </div>
          <div class="player-side-controls">
            <div id="player-rate-anchor" class="player-rate-anchor">
              <div id="player-rate-popover" class="player-rate-popover" hidden>
                <button class="player-rate-option" type="button" data-rate="0.5">0.5x</button>
                <button class="player-rate-option" type="button" data-rate="1">1.0x</button>
                <button class="player-rate-option" type="button" data-rate="1.2">1.2x</button>
                <button class="player-rate-option" type="button" data-rate="1.5">1.5x</button>
                <button class="player-rate-option" type="button" data-rate="1.7">1.7x</button>
                <button class="player-rate-option" type="button" data-rate="2">2x</button>
              </div>
              <button id="player-rate-btn" class="player-rate-btn" type="button" aria-label="Скорость воспроизведения" title="Скорость воспроизведения" aria-haspopup="true" aria-expanded="false">1.0x</button>
            </div>
            <div id="player-volume-anchor" class="player-volume-anchor">
              <div id="player-volume-popover" class="player-volume-popover" hidden>
                <input id="player-volume-input" class="player-volume" type="range" min="0" max="1" step="0.01" value="1" orient="vertical" aria-label="Громкость" />
              </div>
              <button id="player-mute-btn" class="player-icon-btn player-volume-btn" type="button" aria-label="Громкость" title="Громкость" aria-haspopup="true" aria-expanded="false">
                <svg class="player-control-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path d="M4 10v4h4l5 4V6l-5 4Z" />
                  <path d="M16 9a4 4 0 0 1 0 6" />
                  <path d="M18.5 6.5a8 8 0 0 1 0 11" />
                </svg>
              </button>
            </div>
          </div>
        </section>
      </section>
    </main>

    <script type="module" src="{{ url_for('static', path='job-result.js') }}"></script>
  </body>
</html>
